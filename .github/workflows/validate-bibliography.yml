name: Validate research bibliography

on:
  push:
    paths:
      - 'bibliography/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/validate-bibliography.yml'
  pull_request:
    paths:
      - 'bibliography/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/validate-bibliography.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test validation logic
        run: python -m unittest discover -s tests -v
      - name: Check CSL and status integrity
        run: python scripts/validate_bibliography.py
