name: Validate research data

on:
  push:
    paths:
      - 'bibliography/**'
      - 'data/**'
      - 'docs/figures/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/validate-bibliography.yml'
  pull_request:
    paths:
      - 'bibliography/**'
      - 'data/**'
      - 'docs/figures/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/validate-bibliography.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate bibliography
        run: python scripts/validate_bibliography.py
      - name: Validate draft evidence links
        run: python scripts/validate_evidence.py
      - name: Validate study appraisals and hypothesis certainty
        run: python scripts/validate_confidence.py
      - name: Validate AI provenance and conjectures
        run: python scripts/validate_ai_readiness.py
      - name: Rebuild draft matrix
        run: python scripts/build_r1_pilot_matrix.py
      - name: Verify reproducible committed visualization
        run: git diff --exit-code -- docs/figures/r1-draft-coverage.csv docs/figures/r1-draft-coverage.svg
